name: Deploy

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-affected:
    name: Build affected projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx computation cache
        id: nx-cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Show Nx cache status
        run: |
          echo "Cache hit: ${{ steps.nx-cache.outputs.cache-hit }}"

      # Determina os SHAs base e head para o nx affected.
      # NX_BASE aponta para o último commit bem-sucedido na main,
      # NX_HEAD aponta para o commit atual.
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      # Exibe quais projetos serão buildados antes de rodar
      - name: List affected projects
        run: npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD

      # Builda somente os projetos afetados pelas alterações.
      # A flag --configuration=production garante build otimizado.
      # O nx resolve automaticamente as dependências entre projetos
      # (ex: shell depende dos remotes via module federation).
      - name: Build affected projects
        env:
          NX_REJECT_UNKNOWN_LOCAL_CACHE: 0
        run: >
          npx nx affected
          --target=build
          --base=$NX_BASE
          --head=$NX_HEAD
          --configuration=production
          --parallel=3

      # Faz upload dos artefatos de cada app separadamente para uso em etapas futuras de deploy.
      # if-no-files-found: warn evita falha caso o app não tenha sido afetado e não foi buildado.
      - name: Upload artifact - shell
        uses: actions/upload-artifact@v4
        with:
          name: shell
          path: apps/shell/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - product
        uses: actions/upload-artifact@v4
        with:
          name: product
          path: apps/product/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - pc_builder
        uses: actions/upload-artifact@v4
        with:
          name: pc_builder
          path: apps/pc_builder/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - manager_cx
        uses: actions/upload-artifact@v4
        with:
          name: manager_cx
          path: apps/manager_cx/dist
          if-no-files-found: warn
          retention-days: 7
