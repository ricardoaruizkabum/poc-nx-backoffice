name: Deploy

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-affected:
    name: Build affected projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Determina os SHAs base e head para o nx affected.
      # NX_BASE aponta para o último commit bem-sucedido na main,
      # NX_HEAD aponta para o commit atual.
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@v4

      # Exibe quais projetos serão buildados antes de rodar
      - name: List affected projects
        run: npx nx show projects --affected --base=$NX_BASE --head=$NX_HEAD

      # Builda somente os projetos afetados pelas alterações.
      # A flag --configuration=production garante build otimizado.
      # O nx resolve automaticamente as dependências entre projetos
      # (ex: shell depende dos remotes via module federation).
      - name: Build affected projects
        run: >
          npx nx affected
          --target=build
          --base=$NX_BASE
          --head=$NX_HEAD
          --configuration=production
          --parallel=3

      # Faz upload dos artefatos gerados em dist/apps/ para uso em etapas futuras de deploy.
      # Cada app tem seu próprio artefato nomeado com o slug do projeto.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-apps
          path: dist/apps/
          if-no-files-found: warn
          retention-days: 7
