name: Deploy

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-affected:
    name: Build affected projects
    runs-on: ubuntu-latest

    env:
      NX_DAEMON: false
      NX_VERBOSE_LOGGING: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show affected projects
        id: affected
        run: |
          echo "NX_BASE=$NX_BASE"
          echo "NX_HEAD=$NX_HEAD"

          PROJECTS=$(npx nx show projects \
            --affected \
            --base=$NX_BASE \
            --head=$NX_HEAD)

          echo "Affected projects:"
          echo "$PROJECTS"

          {
            echo 'projects<<EOF'
            echo "$PROJECTS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build affected projects individually
        run: |
          while IFS= read -r project
          do
            if [ -n "$project" ]; then
              echo ""
              echo "=============================="
              echo "Building project: $project"
              echo "=============================="

              npx nx build "$project" \
                --configuration=production \
                --verbose
            fi
          done <<< "${{ steps.affected.outputs.projects }}"

      - name: Upload artifact - shell
        uses: actions/upload-artifact@v4
        with:
          name: shell
          path: dist/apps/shell
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - product
        uses: actions/upload-artifact@v4
        with:
          name: product
          path: dist/apps/product
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - pc_builder
        uses: actions/upload-artifact@v4
        with:
          name: pc_builder
          path: dist/apps/pc_builder
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - manager_cx
        uses: actions/upload-artifact@v4
        with:
          name: manager_cx
          path: dist/apps/manager_cx
          if-no-files-found: ignore
          retention-days: 7
