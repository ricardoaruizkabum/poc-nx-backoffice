name: Deploy

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  build-affected:
    name: Build affected projects
    runs-on: ubuntu-latest

    env:
      # recomendado para CI
      NX_DAEMON: false

      # logs detalhados do nx
      NX_VERBOSE_LOGGING: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # necessário para nx affected
          fetch-depth: 0

      # define NX_BASE e NX_HEAD corretamente
      - name: Set SHAs for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show affected projects
        run: |
          echo "NX_BASE=$NX_BASE"
          echo "NX_HEAD=$NX_HEAD"

          npx nx show projects \
            --affected \
            --base=$NX_BASE \
            --head=$NX_HEAD

      - name: Build affected projects
        run: |
          npx nx affected \
            --target=build \
            --base=$NX_BASE \
            --head=$NX_HEAD \
            --configuration=production \
            --parallel=3 \
            --verbose

      - name: Upload artifact - shell
        uses: actions/upload-artifact@v4
        with:
          name: shell
          path: apps/shell/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - product
        uses: actions/upload-artifact@v4
        with:
          name: product
          path: apps/product/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - pc_builder
        uses: actions/upload-artifact@v4
        with:
          name: pc_builder
          path: apps/pc_builder/dist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload artifact - manager_cx
        uses: actions/upload-artifact@v4
        with:
          name: manager_cx
          path: apps/manager_cx/dist
          if-no-files-found: warn
          retention-days: 7
