name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive SHAs for Nx affected
        uses: nrwl/nx-set-shas@v5

      - name: Show affected projects
        run: |
          echo "NX_BASE=$NX_BASE"
          echo "NX_HEAD=$NX_HEAD"

          npx nx show projects \
            --affected \
            --base=$NX_BASE \
            --head=$NX_HEAD

      - name: Run affected typecheck
        run: |
          npx nx affected \
            -t typecheck \
            --base=$NX_BASE \
            --head=$NX_HEAD \
            --parallel=3

      - name: Run affected build
        run: |
          npx nx affected \
            -t build \
            --base=$NX_BASE \
            --head=$NX_HEAD \
            --configuration=production \
            --parallel=3

      - name: Upload artifact - shell
        uses: actions/upload-artifact@v4
        with:
          name: dist-shell
          path: apps/shell/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - product
        uses: actions/upload-artifact@v4
        with:
          name: dist-product
          path: apps/product/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - pc_builder
        uses: actions/upload-artifact@v4
        with:
          name: dist-pc_builder
          path: apps/pc_builder/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact - manager_cx
        uses: actions/upload-artifact@v4
        with:
          name: dist-manager_cx
          path: apps/manager_cx/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Nx fix-ci
        if: always()
        run: npx nx fix-ci
